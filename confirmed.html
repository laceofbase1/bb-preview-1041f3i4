<style>
:root{--teal:#52CECA;--deep:#148F8A;--mint:#8CE2C8;--ink:#131B1E;--grey:#595959;--white:#FFFFFF}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--white);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.6;overflow-x:hidden}
h1{font-family:Poppins,system-ui,sans-serif;font-weight:600;letter-spacing:-.015em;line-height:1.14}
img{display:block;max-width:100%}
a{color:inherit}

.page{max-width:560px;margin:0 auto;padding:22px 24px 56px;text-align:center}
.mark{width:170px;height:auto;margin:0 auto}
.tick{width:64px;height:64px;margin:30px auto 0;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center}
.tick svg{width:30px;height:30px}
h1{margin-top:20px;font-size:clamp(25px,6.6vw,32px)}
.lead{margin-top:14px;font-size:17px;color:var(--grey);line-height:1.6}
.rule{width:54px;height:3px;background:var(--teal);border-radius:2px;margin:26px auto}
.note{font-size:15.5px;color:var(--grey);line-height:1.6}
.note strong{color:var(--ink)}

@media (min-width:700px){
  .page{max-width:620px;padding:40px 32px 72px}
  .mark{width:200px}
}
</style>
